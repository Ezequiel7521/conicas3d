<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Estação 1: Seções Cônicas em RA Didática</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    /* Estilização da interface de botões sobreposta à câmera */
    #ui-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 90%; max-width: 600px; }
    .btn-conica { background-color: rgba(15, 23, 42, 0.85); color: #ffffff; border: 2px solid #38bdf8; padding: 12px 20px; border-radius: 8px; font-family: sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
    .btn-conica:active { background-color: #38bdf8; color: #000000; transform: scale(0.95); }
    #info-card { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: rgba(15, 23, 42, 0.85); color: #f8fafc; padding: 16px 24px; border-radius: 8px; font-family: sans-serif; text-align: center; border: 1px solid #334155; width: 80%; max-width: 450px; }
    #info-title { font-weight: bold; color: #38bdf8; font-size: 1.2em; margin-bottom: 6px; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div id="info-card">
    <div id="info-title">Corte: Circunferência</div>
    <div id="info-desc">O plano de corte é perpendicular ao eixo do cone ($\alpha = 90^\circ$).</div>
  </div>
  <div id="ui-container">
    <button class="btn-conica" onclick="mudarCorte('circulo')">Circunferência</button>
    <button class="btn-conica" onclick="mudarCorte('elipse')">Elipse</button>
    <button class="btn-conica" onclick="mudarCorte('parabola')">Parábola</button>
    <button class="btn-conica" onclick="mudarCorte('hiperbole')">Hipérbole</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <!-- Assets (Carregar o modelo GLB) -->
    <a-assets>
      <a-asset-item id="modeloCorte" src="conica_didatica.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador HIRO (Padrão) -->
    <a-marker preset="hiro">
      <!-- Grupo Central com o Modelo Didático -->
      <a-entity id="cena-conicas" position="0 0.5 0" scale="0.1 0.1 0.1" rotation="-90 0 0">
        <!-- O Modelo Didático é Carregado Aqui -->
        <a-gltf-model src="#modeloCorte"></a-gltf-model>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const cena = document.getElementById('cena-conicas');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');

    function mudarCorte(tipo) {
      switch (tipo) {
        case 'circulo':
          // Plano horizontal, altura específica
          cena.setAttribute('animation', 'property: rotation; to: -90 0 0; dur: 800; easing: easeInOutCubic');
          cena.setAttribute('animation__pos', 'property: position; to: 0 0.5 0; dur: 800; easing: easeInOutCubic');
          infoTitle.innerText = "Corte: Circunferência";
          infoDesc.innerText = "O plano corta o cone perpendicularmente ao seu eixo principal. A interseção é um círculo perfeito.";
          break;
        case 'elipse':
          // Plano inclinado, corta apenas uma folha
          cena.setAttribute('animation', 'property: rotation; to: -65 0 0; dur: 800; easing: easeInOutCubic');
          cena.setAttribute('animation__pos', 'property: position; to: 0 0.4 0; dur: 800; easing: easeInOutCubic');
          infoTitle.innerText = "Corte: Elipse";
          infoDesc.innerText = "O plano corta apenas uma folha do cone, sem ser paralelo a nenhuma geratriz. Forma uma curva oval.";
          break;
        case 'parabola':
          // Plano paralelo a uma geratriz, corta apenas uma folha
          cena.setAttribute('animation', 'property: rotation; to: -37 0 0; dur: 800; easing: easeInOutCubic');
          cena.setAttribute('animation__pos', 'property: position; to: 0 0.3 0.1; dur: 800; easing: easeInOutCubic');
          infoTitle.innerText = "Corte: Parábola";
          infoDesc.innerText = "O plano de corte é paralelo a uma das retas geratrizes do cone. Forma uma curva aberta infinita.";
          break;
        case 'hiperbole':
          // Plano vertical, corta as duas folhas
          cena.setAttribute('animation', 'property: rotation; to: 0 0 0; dur: 800; easing: easeInOutCubic');
          cena.setAttribute('animation__pos', 'property: position; to: 0 0.1 0.3; dur: 800; easing: easeInOutCubic');
          infoTitle.innerText = "Corte: Hipérbole";
          infoDesc.innerText = "O plano é paralelo ao eixo do cone e intersecta ambas as folhas do cone duplo. Forma dois ramos opostos.";
          break;
      }
    }
  </script>
</body>
</html>
